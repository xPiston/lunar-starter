; Additional prod settings on top of php.ini-production (already activated
; by the Dockerfile). validate_timestamps=0 assumes an immutable image:
; every deployment rebuilds the image (new code = new image), the PHP files
; of an already-running container are never modified.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.interned_strings_buffer=16

realpath_cache_size=4096K
realpath_cache_ttl=600

expose_php=Off
