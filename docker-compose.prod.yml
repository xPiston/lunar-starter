# Demonstrates the production topology: a single image (built once), run as
# several services with different commands - not an "all-in-one" container
# with an internal supervisor. This is a reference example for testing/
# understanding the Dockerfile locally; a real production setup will
# generally replace `db` with a managed Postgres instance and run these same
# services through the target orchestrator (k8s, ECS, Fly.io...).
#
# Usage:
#   cp .env.example .env.prod   # then fill in APP_KEY, STRIPE_*, etc.
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml run --rm app php artisan migrate --force
#   docker compose -f docker-compose.prod.yml up -d

x-app: &app
  build: .
  image: ecommerce-hexa-template
  env_file:
    - .env.prod
  environment:
    APP_ENV: production
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: 5432
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *app
    restart: unless-stopped
    ports:
      - '8080:80'

  worker:
    <<: *app
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --max-time=3600

  scheduler:
    <<: *app
    restart: unless-stopped
    command: php artisan schedule:work

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-app}
      POSTGRES_USER: ${DB_USERNAME:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-app}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-prod-data:
